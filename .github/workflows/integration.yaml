on:
  # This allows manual activation of this action for testing.
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  INTEGRATION_TEST_INSTANCE: ${{secrets.INTEGRATION_TEST_INSTANCE}}

permissions:
  contents: read

jobs:
  build:
    name: Integration Tests
    # Pull requests from forks and from Dependabot have no access to the secrets these tests need.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.23'

    - name: build
      run: go build -v ./...
    
    - id: 'auth'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
          credentials_json: '${{ secrets.SPANNER_CASSANDRA_ADAPTER_CICD_SERVICE_ACCOUNT }}'

    - name: it tests against Spanner 
      run: |
          go mod tidy
          go test -v  ./... -tags=integration

    - name: it tests against Cassandra 
      run: |
          go mod tidy
          go test -v  ./... -tags=integration -target=cassandra
